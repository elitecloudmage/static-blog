{{ define "main" }}

<section id="hero" class="scroll-mt-24 min-h-[80vh] flex flex-col items-center justify-center text-center gap-4">
  <div class="flex items-center justify-center w-24 h-24 rounded-full bg-primary-500 text-neutral text-3xl font-bold">
    JL
  </div>
  <h1 class="text-4xl font-extrabold text-neutral-900 dark:text-neutral">
    {{ site.Params.author.name | default site.Title }}
  </h1>
  <p class="text-lg text-neutral-500 dark:text-neutral-400">
    Software / DevOps
  </p>
  <a href="/#about" aria-label="Scroll to About" class="mt-6 animate-bounce text-neutral-400 hover:text-primary-500">
    {{ partial "icon.html" "chevron-down" }}
  </a>
</section>

<section id="about" class="scroll-mt-24 max-w-prose mx-auto py-20">
  <h2 class="text-2xl font-bold text-neutral-900 dark:text-neutral mb-4">About</h2>
  <p class="text-neutral-600 dark:text-neutral-300">
    More about me, coming soon.
  </p>
</section>

<section id="setup" class="scroll-mt-24 max-w-prose mx-auto py-20">
  <h2 class="text-2xl font-bold text-neutral-900 dark:text-neutral mb-4">Setup</h2>
  <p class="text-neutral-600 dark:text-neutral-300">
    Setup details coming soon.
  </p>
</section>

{{ end }}
